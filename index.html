<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Samira</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #05020a;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Floating Text Container */
    .text-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .wish-text {
      position: absolute;
      color: #ff4d88;
      font-weight: 600;
      white-space: nowrap;
      text-shadow: 0 0 8px #ff0055;
      animation: floatUp 8s linear infinite;
      opacity: 0;
    }

    /* Center Main Card */
    .center-card {
      text-align: center;
      z-index: 10;
      padding: 22px 16px;
      width: 88%;
      max-width: 400px;
      background: rgba(18, 6, 30, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 51, 119, 0.4);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.3);
      animation: pulse 2.5s ease-in-out infinite alternate;
    }

    .main-heart {
      font-size: 50px;
      color: #ff0055;
      text-shadow: 0 0 20px #ff0055;
      margin-bottom: 5px;
    }

    .main-title {
      color: #ffffff;
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 500;
    }

    .highlight-name {
      color: #ff66a3;
      font-weight: bold;
      text-shadow: 0 0 8px #ff0055;
    }

    /* বাংলা লেখার ব্রাইট কালার ও গ্লো */
    .bengali-text {
      color: #ffffff;
      font-size: 1.05rem;
      line-height: 1.7;
      font-weight: 600;
      text-shadow: 0 0 8px #ff3377, 0 0 15px #ff0055;
    }

    hr {
      border: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, #ff3377, transparent);
      margin: 14px auto;
      width: 85%;
    }

    /* Keyframe Animations */
    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.75;
      }
      80% {
        opacity: 0.75;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    @keyframes pulse {
      0% { transform: scale(0.98); }
      100% { transform: scale(1.02); }
    }

    /* Floating Heart Elements */
    .heart-bg {
      position: absolute;
      color: #ff4d88;
      font-size: 16px;
      animation: floatUp 6s linear infinite;
      opacity: 0;
    }

    @media (max-width: 400px) {
      .main-heart { font-size: 42px; }
      .main-title { font-size: 0.9rem; }
      .bengali-text { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <!-- Center Card -->
  <div class="center-card">
    <div class="main-heart">💖</div>
    <p class="main-title">
      4th October<br> 
      Many Many Happy Returns Of The Day<br> 
      <span class="highlight-name">My Kutti</span> <br>
      Happy Birthday<br> 
      <span class="highlight-name">My Besttesttestt Friend</span>
      <hr>
      <div class="bengali-text">
        💞 তোর জীবনের প্রতিটা ক্ষণ আনন্দময় হোক 💞<br>
        এই কামনা করি<br>
        তোর সকল স্বপ্ন পূরণ হোক <br>
        সব সময় সুস্থ থাকো...
      </div>
    </p>
  </div>

  <!-- Background Floating Animations -->
  <div class="text-container" id="container"></div>

  <script>
    const container = document.getElementById('container');
    const name = "Samira";
    const messages = [
      `Happy Birthday ${name} 💖`,
      `Happy Birthday Kutti`,
      `Happy Birthday Cutee 💕`,
      `Happy Birthday Paglii 💖`,
      `Happy Birthday Jan 💕`,
      `💖 ${name} 💖`,
      `Happy Birthday ${name} ✨`
    ];

    function createText() {
      const text = document.createElement('div');
      text.className = 'wish-text';
      text.innerText = messages[Math.floor(Math.random() * messages.length)];
      
      text.style.left = Math.random() * 80 + 'vw';
      
      const isMobile = window.innerWidth < 600;
      const minFont = isMobile ? 11 : 15;
      const maxFont = isMobile ? 15 : 20;
      
      text.style.fontSize = (Math.random() * (maxFont - minFont) + minFont) + 'px';
      text.style.animationDuration = (Math.random() * 3 + 6) + 's';
      
      container.appendChild(text);

      setTimeout(() => {
        text.remove();
      }, 9000);
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart-bg';
      heart.innerText = Math.random() > 0.5 ? '❤️' : '💖';
      
      heart.style.left = Math.random() * 90 + 'vw';
      heart.style.fontSize = (Math.random() * 8 + 12) + 'px';
      heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
      
      container.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createText, 550);
    setInterval(createHeart, 400);
  </script>
</body>
</html>
