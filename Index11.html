<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title I love you Aftab </title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #05020a !important;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Floating Text Container */
    .text-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .wish-text {
      position: absolute;
      color: #ff4d88 !important;
      font-weight: 600;
      white-space: nowrap;
      text-shadow: 0 0 8px #ff0055;
      animation: floatUp 8s linear infinite;
      opacity: 0;
    }

    /* Center Main Card */
    .center-card {
      text-align: center;
      z-index: 10;
      padding: 20px 15px;
      width: 90%;
      max-width: 400px;
      background: rgba(18, 6, 30, 0.85);
      border: 1px solid rgba(255, 51, 119, 0.4);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.3);
      animation: pulse 2.5s ease-in-out infinite alternate;
    }

    .main-heart {
      font-size: 50px;
      color: #ff0055 !important;
      text-shadow: 0 0 20px #ff0055;
      margin-bottom: 5px;
    }

    .english-text {
      color: #ffffff !important;
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 500;
      text-shadow: 0 0 8px #ff3377;
    }

    .highlight-name {
      color: #ff66a3 !important;
      font-weight: bold;
      text-shadow: 0 0 8px #ff0055;
    }

    /* বাংলা লেখার ফিক্সড সাদা কালার */
    .bengali-text {
      color: #ffffff !important;
      font-size: 1rem !important;
      line-height: 1.8 !important;
      font-weight: bold !important;
      text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055 !important;
      display: block;
      margin-top: 10px;
    }

    hr {
      border: 0;
      height: 1.5px;
      background: #ff3377;
      margin: 12px auto;
      width: 85%;
    }

    /* Keyframe Animations */
    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.75;
      }
      80% {
        opacity: 0.75;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    @keyframes pulse {
      0% { transform: scale(0.98); }
      100% { transform: scale(1.02); }
    }

    /* Floating Heart Elements */
    .heart-bg {
      position: absolute;
      color: #ff4d88 !important;
      font-size: 16px;
      animation: floatUp 6s linear infinite;
      opacity: 0;
    }

    @media (max-width: 400px) {
      .main-heart { font-size: 42px; }
      .english-text { font-size: 0.9rem; }
      .bengali-text { font-size: 0.9rem !important; }
    }
  </style>
</head>
<body>

  <!-- Center Card -->
  <div class="center-card">
    <div class="main-heart">💖</div>
    
    <div class="bengali-text">
      আমার অসীম উদার ভালোবাসা কোনো শর্তে বাঁধা নয়, কোনো হিসাবের খাতায় লেখা নয়।✍️
তোমার হাসিতে আমি আনন্দ খুঁজি, তোমার সুখে নিজের প্রার্থনা জুড়ে দিই।🤲❤️
আমার ভালোবাসা নদীর মতো—নিঃশব্দে বয়ে চলে, বিনিময়ে কিছু চায় না।❤️❤️
আকাশের মতো বিস্তৃত, সমুদ্রের মতো গভীর, আর ভোরের আলোর মতো নির্মল।
দূরত্ব, সময় কিংবা অভিমান—কিছুই তাকে শেষ করতে পারে না।
কারণ তোমাকে ভালোবাসা আমার কাছে কোনো মুহূর্তের অনুভূতি নয়; এটি আমার হৃদয়ের সবচেয়ে পবিত্র অধ্যায়।❤️🌸
যতদিন শ্বাস থাকবে, ততদিন আমার এই অসীম উদার ভালোবাসা তোমার জন্যই নীরবে দোয়া হয়ে থাকবে😘

ইতি 
তোমার দ্বিনা 😘

  </div>

  <!-- Background Floating Animations -->
  <div class="text-container" id="container"></div>

  <script>
    const container = document.getElementById('container');
    const name = "Aftab";
    const messages = [
      `I love you ${name} 💖`,
      `I love you jaan😘`,
      `I love you like an Ocean 💕`,
      `I love you like a mountain 💖`,
      `I love you to deep inalot heart Aftab 💕`,
      `I love you alot 💖`,
      `I love you ${name} ✨`
    ];

    function createText() {
      const text = document.createElement('div');
      text.className = 'wish-text';
      text.innerText = messages[Math.floor(Math.random() * messages.length)];
      
      text.style.left = Math.random() * 80 + 'vw';
      
      const isMobile = window.innerWidth < 600;
      const minFont = isMobile ? 11 : 15;
      const maxFont = isMobile ? 15 : 20;
      
      text.style.fontSize = (Math.random() * (maxFont - minFont) + minFont) + 'px';
      text.style.animationDuration = (Math.random() * 3 + 6) + 's';
      
      container.appendChild(text);

      setTimeout(() => {
        text.remove();
      }, 9000);
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart-bg';
      heart.innerText = Math.random() > 0.5 ? '❤️' : '💖';
      
      heart.style.left = Math.random() * 90 + 'vw';
      heart.style.fontSize = (Math.random() * 8 + 12) + 'px';
      heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
      
      container.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createText, 550);
    setInterval(createHeart, 400);
  </script>
</body>
</html>
